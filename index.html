<script type="module">

function tileTexture(cols, n, opts = {}) {

}
const surfaces = [];
{

  const LAMPS = [[-1.5, -2.9], [1.5, -2.9], [-1.5, -0.5], [1.5, -0.5]];

  for (let i = -3; i <= 3; i++) { const bar = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.01, 0.022), new THREE.MeshLambertMaterial({ color: 0x55636b })); bar.position.set(0.3, 0.006, back + 1.4 + i * 0.05); world.add(bar); }

    sg.lineWidth = 10; sg.strokeStyle = '#f2b72c'; sg.stroke();
    sg.fillStyle = '#ffd257'; sg.font = '700 40px "Noto Sans KR", sans-serif'; sg.textAlign = 'center'; sg.fillText('WASH KNIGHT · 몬스터 전용 워시샵', 512, 82);
    sg.fillStyle = '#ffffff'; sg.font = '400 112px "Black Han Sans", sans-serif'; sg.fillText('워시 나이트', 512, 206);
    signTex.needsUpdate = true;
  };
  const signTex = new THREE.CanvasTexture(sc); signTex.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.6), new THREE.MeshBasicMaterial({ map: signTex, transparent: true }));

  drawSign(); document.fonts && document.fonts.ready.then(drawSign);

  const bc = [0xe889f2, 0x3fb36b, 0xf2b72c, 0x5fa8ff];
  for (let i = 0; i < 5; i++) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.26 + (i % 2) * 0.06, 16), new THREE.MeshLambertMaterial({ color: bc[i % 4] }));
    b.position.set(-w + 0.14, 1.5 + (i % 2) * 0.03, back + 1.05 + i * 0.2); world.add(b);
  }
}
// wet overlay on back wall
const wetCv = document.createElement('canvas'); wetCv.width = 512; wetCv.height = 256;
const wetG = wetCv.getContext('2d');
const wetTex = new THREE.CanvasTexture(wetCv);
const wetMesh = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w * 2, ROOM.h), new THREE.MeshBasicMaterial({ map: wetTex, transparent: true, depthWrite: false, toneMapped: false }));
wetMesh.position.set(0, ROOM.h / 2, ROOM.back + 0.004); world.add(wetMesh);
let wetDirty = 0;
function wetMark(p, r, a, foamy = false) {
  if (Math.abs(p.z - ROOM.back) > 0.05) return;
  const u = (p.x + ROOM.w) / (ROOM.w * 2) * 512, v = (1 - p.y / ROOM.h) * 256, rp = r / (ROOM.w * 2) * 512;

// ================================================================== viewmodel
const vscene = new THREE.Scene();

vscene.add(new THREE.HemisphereLight(0xe6ecff, 0x3b3a4a, 0.6));
const vkey = new THREE.DirectionalLight(0xfff1dd, 2.2); vkey.position.set(-1.5, 2.5, 1.5); vscene.add(vkey);
const vrim = new THREE.DirectionalLight(0x9fb4ff, 1.4); vrim.position.set(2, 0.6, -2); vscene.add(vrim);
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));   // let the loading screen paint first
const rig = buildRig({ lod: MOBILE ? 0.75 : 1 });
const MIN_DPR = MOBILE ? 0.75 : 1;
const aimPivot = new THREE.Group();
vcam.add(aimPivot);
aimPivot.add(rig.root);
const LAND = { pos: new THREE.Vector3(0.333, -0.175, -0.65), rot: new THREE.Euler(0.05, 0.12, 0.15, 'YXZ'), pivot: new THREE.Vector3(0.27, -0.33, -0.32) };
const PORT = { pos: new THREE.Vector3(0.23, -0.47, -0.64), rot: new THREE.Euler(0.04, 0.34, 0.2, 'YXZ'), pivot: new THREE.Vector3(0.19, -0.6, -0.32), tanH: 0.44 };

let VW = 1, VH = 1, ASPK = 1;
function layout() {

let pointScale = 600;

// ================================================================== water fx
const STREAM_VS = `
attribute float aT;
varying float vT; varying vec3 vN; varying vec3 vV;
void main() { vT = aT; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`;
const STREAM_FS = `
uniform float uTime, uAlpha, uSpeed, uLo, uBase; uniform vec3 uCore, uEdge;
varying float vT; varying vec3 vN; varying vec3 vV;
float h1(float n) { return fract(sin(n) * 43758.5453); }

      tmpN.crossVectors(tmpT, UPV).normalize();
      const p = tmpV.clone().addScaledVector(tmpN, (Math.random() * 2 - 1) * spread * tt).add(new THREE.Vector3((Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.03, 0));
      const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.35, Math.random() - 0.5).multiplyScalar(0.9).addScaledVector(tmpT, 2.5 + Math.random() * 2);
      spawn(p, v, 0.007 + Math.random() * 0.01, 0.2 + Math.random() * 0.25, 0);
    }
  };
  if (jetOuter.visible) {
    const cu = curveFor(startW, H, 0.035);
    updateTube(jetOuter, cu, 0.009, 0.09, 0.14, t);
    updateTube(jetCore, cu, 0.0035, 0.03, 0.1, t);
    if (spray > 0.5) trail(cu, cnt(3), 0);
  }
  if (fan.visible) { const cu = curveFor(startW, H, 0.03); updateFan(cu, 0.004, 0.42); if (spray > 0.5) trail(cu, cnt(3), 0.42); }
  if (soapJet.visible) updateTube(soapJet, curveFor(startW, H, 0.12), 0.004, 0.03, 0.25, t);
  // impact fx
  if (spray > 0.6) {
    const n = hitN, rv = new THREE.Vector3();
    if (tool === 'red') {
      for (let i = 0, N = cnt(7); i < N; i++) {
        rv.set(Math.random() - 0.5, Math.random() * 0.8, Math.random() - 0.5).normalize().multiplyScalar(1.4 + Math.random() * 2.2).addScaledVector(n, 1.2 + Math.random());
        spawn(H, rv, 0.022 + Math.random() * 0.03, 0.35 + Math.random() * 0.45, 0);
      }
      if (Math.random() < 0.5 * k60) spawn(H.clone().addScaledVector(n, 0.05), n.clone().multiplyScalar(0.3), 0.25, 0.7, 1);
      wetMark(H, 0.28, Math.min(0.18, 0.06 * k60));
    } else if (tool === 'green') {
      sideV.crossVectors(n, UPV); if (sideV.lengthSq() < 1e-4) sideV.set(1, 0, 0); sideV.normalize();
      for (let i = 0, N = cnt(6); i < N; i++) {
        const q = H.clone().addScaledVector(sideV, (Math.random() * 2 - 1) * 0.42);
        rv.set(Math.random() - 0.5, Math.random() * 0.6, Math.random() - 0.5).normalize().multiplyScalar(0.8 + Math.random() * 1.4).addScaledVector(n, 0.8);
        spawn(q, rv, 0.018 + Math.random() * 0.022, 0.3 + Math.random() * 0.35, 0);
        if (i < 3) wetMark(q, 0.2, Math.min(0.09, 0.03 * k60));
      }
      if (Math.random() < 0.5 * k60) spawn(H.clone().addScaledVector(sideV, (Math.random() - 0.5) * 0.7), n.clone().multiplyScalar(0.25), 0.32, 0.8, 1);
    } else {
      for (let i = 0, N = cnt(0.7); i < N && foam.length < FMAX - 2; i++) foam.push({ mode: 'fly', t: 0, sp: 2.2 + Math.random() * 0.8, r: 0.025 + Math.random() * 0.03, P0: startW.clone(), off: new THREE.Vector3((Math.random() - 0.5) * 0.12, (Math.random() - 0.5) * 0.12, 0) });
    }
    // nozzle mist
    if (Math.random() < 0.6 * k60) spawn(startW, new THREE.Vector3((Math.random() - 0.5) * 0.4, Math.random() * 0.3, (Math.random() - 0.5) * 0.4), 0.012, 0.3, 0);
  } else if (!firing && Math.random() < dt * 0.7) {
    spawn(startW, new THREE.Vector3(0, -0.05, 0), 0.016, 0.9, 0);    // idle drip
  }
  updateParticles(dt);
  pMat.uniforms.uScale.value = pointScale;
  // foam update
  let fi = 0;
  for (let i = foam.length - 1; i >= 0; i--) {
    const f = foam[i];
    if (f.mode === 'fly') {
      f.t += dt * f.sp;
      const cu = curveFor(f.P0, hit.clone().add(f.off), 0.16);
      if (f.t >= 1) {
        f.mode = 'stick'; f.p = hit.clone().add(f.off).addScaledVector(hitN, 0.01); f.n = hitN.clone(); f.life = 0; f.r *= 1.25;
        if (foam.length < FMAX - 8) {
          sideV.crossVectors(f.n, UPV); if (sideV.lengthSq() < 1e-4) sideV.set(1, 0, 0); sideV.normalize();
          const upW = new THREE.Vector3().crossVectors(sideV, f.n);
          for (let k = 0; k < 2; k++) {
            const a = Math.random() * Math.PI * 2, d = f.r * (0.7 + Math.random() * 0.5);
            const p = f.p.clone().addScaledVector(sideV, Math.cos(a) * d).addScaledVector(upW, Math.sin(a) * d).addScaledVector(f.n, 0.004 * k);
            foam.push({ mode: 'stick', p, n: f.n, life: Math.random() * 0.4, r: f.r * (0.45 + Math.random() * 0.35) });
          }
        }
        wetMark(f.p, 0.12, 0.08, true);
        for (let k = 0; k < 2; k++) spawn(f.p, new THREE.Vector3(Math.random() - 0.5, Math.random(), Math.random() - 0.5).addScaledVector(f.n, 0.5), 0.03, 0.4, 2);
      } else {
        bez(cu.P0, cu.C, cu.P1, f.t, tmpV);
        const r = f.r * (0.45 + f.t * 0.8);
        tmpM.compose(tmpV, tmpQ.identity(), tmpS.set(r, r, r));
        foamMesh.setMatrixAt(fi++, tmpM);
      }
    }
    if (f.mode === 'stick') {
      f.life += dt;
      const k = 1 - Math.min(1, f.life / 3.8);
      if (k <= 0) { foam.splice(i, 1); continue; }
      tmpQ.setFromUnitVectors(UPV, f.n);
      tmpM.compose(f.p, tmpQ, tmpS.set(f.r * (0.6 + 0.4 * k), f.r * 0.35 * k + 0.002, f.r * (0.6 + 0.4 * k)));
      foamMesh.setMatrixAt(fi++, tmpM);
    }
  }
  for (let i = fi; i < FMAX; i++) foamMesh.setMatrixAt(i, ZERO);
  foamMesh.instanceMatrix.needsUpdate = true;
  // wet layer fade + upload
  frames++;
  if (frames % 12 === 0) { wetG.globalCompositeOperation = 'destination-out'; wetG.fillStyle = 'rgba(0,0,0,0.04)'; wetG.fillRect(0, 0, 512, 256); wetG.globalCompositeOperation = 'source-over'; wetDirty = 1; }
  if (wetDirty && frames % 2 === 0) { wetTex.needsUpdate = true; wetDirty = 0; }
  // render: world, then viewmodel on top
  renderer.clear();
  renderer.render(world, wcam);
  renderer.clearDepth();
  renderer.render(vscene, vcam);
  drawReticle();
  // adaptive resolution
  if (!window.__noAdapt && frames > 30 && frames < 400) { slowAcc += dt; slowN++; if (slowN === 90) { if (slowAcc / slowN > 1 / 38 && DPR > MIN_DPR) { DPR = Math.max(MIN_DPR, DPR - 0.5); layout(); } slowAcc = 0; slowN = 0; } }
  if (!window.__rec) requestAnimationFrame(frame);
}
// reticle as a tiny 2D overlay canvas
const rc = document.createElement('canvas');
rc.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none';
document.body.insertBefore(rc, document.querySelector('.brand'));
const rctx = rc.getContext('2d');
function drawReticle() {
  const RD = Math.min(2, window.devicePixelRatio || 1);
  if (rc.width !== Math.round(VW * RD) || rc.height !== Math.round(VH * RD)) { rc.width = Math.round(VW * RD); rc.height = Math.round(VH * RD); rctx.setTransform(RD, 0, 0, RD, 0, 0); }
  rctx.clearRect(0, 0, VW, VH);
  const x = (ndc.x + 1) / 2 * VW, y = (1 - ndc.y) / 2 * VH, r = firing ? 11 + Math.random() * 1.5 : 15;
  rctx.lineWidth = 4; rctx.strokeStyle = 'rgba(10,14,30,0.55)'; rctx.beginPath(); rctx.arc(x, y, r, 0, Math.PI * 2); rctx.stroke();
  rctx.lineWidth = 2; rctx.strokeStyle = 'rgba(255,255,255,0.92)'; rctx.beginPath(); rctx.arc(x, y, r, 0, Math.PI * 2); rctx.stroke();
  rctx.fillStyle = '#fff'; rctx.beginPath(); rctx.arc(x, y, 2, 0, Math.PI * 2); rctx.fill();
}

layout();
renderer.compile(world, wcam); renderer.compile(vscene, vcam);
document.getElementById('loading').style.opacity = 0;
setTimeout(() => document.getElementById('loading').remove(), 600);
if (!window.__rec) requestAnimationFrame(frame);
window.__ready = true;
window.__demo = {
  set(o) {
    if (o.attract) { attract = true; aT = 0; pill.classList.remove('off'); return; }
    endAttract();
    if (o.ndc) { ndc.set(o.ndc[0], o.ndc[1]); }
    if (o.fire !== undefined) firing = o.fire;
    if (o.tool) setTool(o.tool);
    if (o.look) setLook(o.look);
  },
  port(o) { if (o.pos) PORT.pos.set(...o.pos); if (o.rot) PORT.rot.set(...o.rot, 'YXZ'); if (o.pivot) PORT.pivot.set(...o.pivot); if (o.tanH) PORT.tanH = o.tanH; layout(); },
  step(ms) { frame((now + ms / 1000) * 1000); },
  grab(label) {
    const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
    const g = c.getContext('2d'); g.drawImage(cv, 0, 0); g.drawImage(rc, 0, 0, c.width, c.height);
    if (label) {
      const s = c.height / 844 * (c.width > c.height ? 1.5 : 1);
      g.font = `700 ${Math.round(17 * s)}px "Noto Sans KR", sans-serif`;
      const w = g.measureText(label).width + 30 * s, h = 40 * s, x = (c.width - w) / 2, y = c.height - h - 26 * s;
      g.fillStyle = 'rgba(12,16,28,0.66)'; g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill();
      g.fillStyle = '#ffe08a'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, c.width / 2, y + h / 2 + 1 * s);
    }
    return c.toDataURL('image/jpeg', 0.92);
  },
  stats: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, dpr: DPR }),
};
</script>
