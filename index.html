<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>워시 나이트 3D · 기본 게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141c22; color: #fff;
    font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  @media (pointer: fine) { canvas { cursor: grab; } canvas:active { cursor: grabbing; } }
  .brand { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .brand p { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .16em; color: #ffd257; }
  .brand h1 { margin: 4px 0 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 30px; line-height: 1; }
  .hint { position: fixed; top: calc(78px + env(safe-area-inset-top)); right: calc(18px + env(safe-area-inset-right)); max-width: 46vw;
    font-size: 13px; line-height: 1.5; color: #e3e8ff; text-align: right; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .panel { position: fixed; display: flex; gap: 6px; padding: 6px; border-radius: 16px; background: rgba(12,16,28,.62);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .tools { left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); }
  .looks { right: calc(14px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); }
  .panel button { min-width: 44px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 11px; background: transparent;
    color: #e8ecff; font: 700 14px 'Noto Sans KR', sans-serif; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; }
  .panel button { white-space: nowrap; }
  .panel button[aria-pressed="true"] { background: rgba(255,255,255,.17); box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); }
  .panel button svg { width: 20px; height: 20px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25), 0 0 0 2px rgba(0,0,0,.4); flex: none; }
  .dot.red { background: #e5463e; } .dot.green { background: #34b36a; }
  .dot.soap { background: #2c2d3b; box-shadow: inset 0 0 0 3px #e889f2, 0 0 0 2px rgba(0,0,0,.4); }
  kbd { font: 700 11px 'Noto Sans KR', sans-serif; color: #aab3dd; border: 1px solid rgba(170,179,221,.5); border-radius: 4px; padding: 0 4px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; color: #cfd6f5; background: #141c22; transition: opacity .5s; z-index: 5; }
  @media (pointer: coarse) { kbd, .pc { display: none; } }
  @media (pointer: fine) { .touch { display: none; } }
  @media (max-width: 480px) { kbd { display: none; } }
  @media (max-width: 560px) { .brand h1 { font-size: 24px; } .panel button { padding: 0 10px; font-size: 13px; } .hint { font-size: 12px; } }
  .demo-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); padding: 9px 15px;
    border-radius: 999px; background: rgba(12,16,28,.66); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 13px; font-weight: 700; color: #ffe08a; pointer-events: none; white-space: nowrap; transition: opacity .45s; }
  .demo-pill.off { opacity: 0; }
  .fire { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 88px; height: 88px;
    border: 0; border-radius: 50%; padding: 0; color: #fff; display: grid; place-items: center; align-content: center; gap: 2px; cursor: pointer;
    font: 700 13px 'Noto Sans KR', sans-serif; letter-spacing: .02em; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    background: radial-gradient(circle at 50% 36%, rgba(255,255,255,.26), rgba(255,255,255,.05) 64%), rgba(12,16,28,.58);
    box-shadow: inset 0 0 0 3px var(--tc, #e5463e), 0 6px 18px rgba(0,0,0,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .08s, box-shadow .12s; }
  .fire svg { width: 30px; height: 30px; }
  .fire[data-on="true"] { transform: scale(.93); box-shadow: inset 0 0 0 4px var(--tc, #e5463e), 0 0 26px var(--tc, #e5463e);
    background: radial-gradient(circle at 50% 36%, rgba(255,255,255,.4), rgba(255,255,255,.1) 64%), rgba(12,16,28,.5); }
  .panel button { touch-action: manipulation; }
  @media (orientation: portrait) { .tools { bottom: calc(22px + env(safe-area-inset-bottom)); } }
  /* game HUD */
  .hudtop { position: fixed; left: calc(14px + env(safe-area-inset-left)); right: calc(14px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top));
    pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.55); }
  .hudtop[hidden] { display: none; }
  .zinfo { display: flex; align-items: baseline; gap: 10px; height: 44px; font-weight: 700; font-size: 14px; color: #ffd257; }
  .timer { display: inline-block; font-family: 'Black Han Sans', sans-serif; font-size: 28px; color: #fff; letter-spacing: .03em; }
  .timer.warn { color: #ff6b5e; animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  .boss { margin: 6px auto 0; max-width: 520px; }
  .bossrow { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700; }
  .bossrow em { font-style: normal; color: #ff9b8a; margin-right: 4px; }
  .bar { position: relative; height: 15px; margin-top: 5px; border-radius: 5px; background: rgba(10,12,22,.78);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), 0 3px 10px rgba(0,0,0,.45); overflow: hidden; }
  .bar i { position: absolute; left: 3px; top: 3px; bottom: 3px; width: calc(100% - 6px); border-radius: 3px; transform-origin: left; }
  .bar .chip { background: #fff1c2; transition: transform .45s ease .3s; }
  .bar .fill { background: linear-gradient(180deg, #ff8f70, #d63a2e); }
  .banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(34px, 9vw, 60px); color: #fff; text-shadow: 0 4px 0 #1b2140, 0 0 26px rgba(0,0,0,.5);
    opacity: 0; transform: scale(.82); transition: opacity .22s, transform .22s; }
  .banner.on { opacity: 1; transform: scale(1); }
  .banner small { display: block; margin-top: 6px; font: 700 17px 'Noto Sans KR', sans-serif; color: #ffe08a; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .overlay { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 20px; background: rgba(8,12,20,.5);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .overlay[hidden] { display: none; }
  .card { width: min(400px, 100%); box-sizing: border-box; padding: 26px 22px 22px; border-radius: 22px; text-align: center; background: rgba(16,22,38,.93);
    box-shadow: 0 0 0 2px rgba(242,183,44,.7), 0 22px 50px rgba(0,0,0,.5); }
  .card h1, .card h2 { margin: 4px 0 6px; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 44px; line-height: 1.05; }
  .card h2 { font-size: 38px; }
  .kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #ffd257; }
  .sub { margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: #e6ebff; }
  .how { margin: 16px 0 20px; padding-left: 18px; text-align: left; font-size: 13.5px; line-height: 1.65; color: #d9e0ff; }
  .how b.r { color: #ff8a80; } .how b.g { color: #6fdc9b; } .how b.p { color: #f0a6f7; }
  .big { min-height: 52px; padding: 0 28px; border: 0; border-radius: 14px; cursor: pointer; font: 700 17px 'Noto Sans KR', sans-serif;
    color: #1b1730; background: linear-gradient(#ffd257, #f2a72c); box-shadow: 0 4px 0 #b9761a; touch-action: manipulation; }
  .big:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9761a; }
  .big.alt { color: #fff; background: rgba(255,255,255,.12); box-shadow: none; }
  .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .grade { margin: 4px 0 2px; font-family: 'Black Han Sans', sans-serif; font-size: 92px; line-height: 1; color: #ffd257; text-shadow: 0 5px 0 #8a5a12; }
  .rows { margin: 14px 0 20px; font-size: 14px; color: #dfe5ff; }
  .rows div { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,.08); }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<canvas id="c" aria-label="1인칭 3D 세척건 데모"></canvas>
<div class="hudtop" id="hudTop" hidden>
  <div class="zinfo"><span id="zoneLbl">구역 1/3</span><span class="timer" id="timer">1:20</span></div>
  <div class="boss">
    <div class="bossrow"><span id="bossName">임시 몬스터</span><span><em>때 HP</em><span id="hpNum">0 / 0</span></span></div>
    <div class="bar"><i class="chip" id="hpChip"></i><i class="fill" id="hpFill"></i></div>
  </div>
</div>
<div class="banner" id="banner"></div>
<div class="panel tools" role="group" aria-label="노즐 선택">
  <button data-tool="red" aria-pressed="true"><span class="dot red"></span>집중<kbd>1</kbd></button>
  <button data-tool="green" aria-pressed="false"><span class="dot green"></span>넓은<kbd>2</kbd></button>
  <button data-tool="soap" aria-pressed="false"><span class="dot soap"></span>세제<kbd>3</kbd></button>
</div>
<div class="panel looks" role="group" aria-label="화면 스타일">
  <button data-look="toon" aria-pressed="true">툰</button>
  <button data-look="real" aria-pressed="false">리얼</button>
  <button id="mute" aria-pressed="false" aria-label="소리 끄기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="w" d="M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
  </button>
</div>
<button class="fire" id="fire" data-on="false" aria-label="분사 (누르고 있기)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 3.5c3 3.6 5.5 6.7 5.5 9.6a5.5 5.5 0 0 1-11 0c0-2.9 2.5-6 5.5-9.6z"/><path d="M9.6 14.2a2.6 2.6 0 0 0 2.4 2.4"/>
  </svg>분사</button>
<div class="overlay" id="titleOv">
  <div class="card">
    <p class="kicker">WASH KNIGHT · 몬스터 전용 워시샵</p>
    <h1>워시 나이트</h1>
    <p class="sub">구역 3곳의 몬스터 때 HP를<br>제한시간 안에 0으로 만들어요</p>
    <ul class="how">
      <li class="touch">화면을 끌어서 시점 이동, <b>분사 버튼</b>을 누르고 있으면 가운데로 발사</li>
      <li class="pc" id="pcHint">화면 클릭 후 마우스로 시점 이동, 누르고 있으면 분사 (Esc 해제)</li>
      <li><b class="r">집중</b> 좁고 강하게 · <b class="g">넓은</b> 넓고 약하게</li>
      <li><b class="p">세제</b>를 바른 곳은 물로 훨씬 빨리 지워져요</li>
    </ul>
    <button class="big" id="startBtn">세척 시작</button>
  </div>
</div>
<div class="overlay" id="resultOv" hidden>
  <div class="card">
    <p class="kicker">세척 완료</p>
    <div class="grade" id="grade">S</div>
    <p class="sub" id="totalTime"></p>
    <div class="rows" id="rows"></div>
    <button class="big" id="againBtn">다시 하기</button>
  </div>
</div>
<div class="overlay" id="failOv" hidden>
  <div class="card">
    <p class="kicker">TIME OVER</p>
    <h2>시간 초과!</h2>
    <p class="sub" id="failMsg"></p>
    <div class="btns"><button class="big" id="retryZoneBtn">이 구역 다시</button><button class="big alt" id="restartBtn">처음부터</button></div>
  </div>
</div>
<div class="loading" id="loading">세척건 조립 중…</div>
<script>
  window.addEventListener('error', function () { var l = document.getElementById('loading'); if (l && !window.__ready) l.textContent = '3D를 불러오지 못했어요 · 새로고침해 주세요'; });
  setTimeout(function () { var l = document.getElementById('loading'); if (l && !window.__ready) l.textContent = '불러오는 중… 연결이 조금 느려요'; }, 15000);
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildRig } from './rig.js';
import { buildWorld, HALL, bayX } from './world.js';
import { createMonster } from './monster.js';

const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp, D2R = THREE.MathUtils.DEG2RAD;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.autoClear = false;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

// ================================================================== world (wash hall, 3 bays)
const world = new THREE.Scene();
const wcam = new THREE.PerspectiveCamera(60, 1, 0.05, 40);
wcam.rotation.order = 'YXZ';
const WORLD = buildWorld(world);
const surfaces = WORLD.surfaces;
const ROOM = WORLD.bounds;
const CAM_POS = new THREE.Vector3(bayX(0), HALL.camY, HALL.camZ);
wcam.position.copy(CAM_POS);
// wet overlays: one canvas per room surface, marks fade out over time
const wets = surfaces.map((sf) => {
  const W = sf.geometry.parameters.width, H = sf.geometry.parameters.height, cw = Math.min(1024, Math.max(32, Math.round(W * 71))), ch = Math.max(32, Math.round(cw * H / W));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
  m.position.copy(sf.position); m.quaternion.copy(sf.quaternion); m.translateZ(sf.userData.wetOff || 0.004);
  m.renderOrder = 1; world.add(m); m.updateMatrixWorld();
  return { m, g: c.getContext('2d'), tex, W, H, cw, ch, kx: cw / W, ky: ch / H, dirty: 0, ink: 0, lx: 0, ly: 0 };
});
const tmpL = new THREE.Vector3();
function wetMark(p, r, a, foamy = false) {
  let o = null, bd = 0.06;
  for (const q of wets) {
    tmpL.copy(p); q.m.worldToLocal(tmpL);
    if (Math.abs(tmpL.z) < bd && Math.abs(tmpL.x) <= q.W / 2 + r && Math.abs(tmpL.y) <= q.H / 2 + r) { bd = Math.abs(tmpL.z); o = q; q.lx = tmpL.x; q.ly = tmpL.y; }
  }
  if (!o) return;
  const u = (o.lx + o.W / 2) * o.kx, v = (o.H / 2 - o.ly) * o.ky, rp = r * o.kx;
  const g = o.g.createRadialGradient(u, v, 0, u, v, rp);
  if (foamy) { g.addColorStop(0, `rgba(255,248,255,${a})`); g.addColorStop(0.7, `rgba(240,225,250,${a * 0.8})`); g.addColorStop(1, 'rgba(240,225,250,0)'); }
  else { g.addColorStop(0, `rgba(5,22,30,${a})`); g.addColorStop(1, 'rgba(5,22,30,0)'); }
  o.g.fillStyle = g; o.g.beginPath(); o.g.arc(u, v, rp, 0, Math.PI * 2); o.g.fill();
  o.dirty = 1; o.ink = 90;
}

// ================================================================== viewmodel
const vscene = new THREE.Scene();
const vcam = new THREE.PerspectiveCamera(42, 1, 0.01, 10);
vscene.add(vcam);
const pmrem = new THREE.PMREMGenerator(renderer);
vscene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
vscene.add(new THREE.HemisphereLight(0xe6ecff, 0x3b3a4a, 0.6));
const vkey = new THREE.DirectionalLight(0xfff1dd, 2.2); vkey.position.set(-1.5, 2.5, 1.5); vscene.add(vkey);
const vrim = new THREE.DirectionalLight(0x9fb4ff, 1.4); vrim.position.set(2, 0.6, -2); vscene.add(vrim);
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));   // let the loading screen paint first
const rig = buildRig({ lod: MOBILE ? 0.75 : 1 });
const MIN_DPR = MOBILE ? 0.75 : 1;

// ================================================================== game data
const ZONES = [
  { name: '임시 몬스터 1', R: 0.68, base: 0x9be0cf, shade: 0x4f9f97, dirt: 0.65, crust: 0.0, time: 80, hp: 1200, seed: 3 },
  { name: '임시 몬스터 2', R: 0.8, base: 0xc3b4f2, shade: 0x6f62b0, dirt: 0.85, crust: 0.8, time: 100, hp: 2000, seed: 11 },
  { name: '임시 몬스터 3', R: 0.92, base: 0xf6c09a, shade: 0xc0745a, dirt: 1.15, crust: 1.2, time: 120, hp: 3000, seed: 23 },
];
// spray footprint (metres, in the screen plane) and grime removal per second at its centre
const FP = {
  red: { rx: 0.075, ry: 0.075, str: 9, soapAdd: 0, soapWash: 0.8 },
  green: { rx: 0.3, ry: 0.09, str: 1.6, soapAdd: 0, soapWash: 0.45 },
  soap: { rx: 0.28, ry: 0.22, str: 0.4, soapAdd: 6, soapWash: 0 },
};
const CLEAR_AT = 0.05;              // zone clears when 5% of the grime is left
const GRADES = [[130, 'S'], [175, 'A'], [225, 'B'], [Infinity, 'C']];
const monsters = ZONES.map((z, i) => {
  const m = createMonster({ ...z, z: HALL.monZ }, new THREE.Vector3(bayX(i), HALL.camY, HALL.camZ), MOBILE ? 20 : 26);
  world.add(m.root);
  return m;
});
const G = { state: 'title', zone: 0, left: 0, t: 0, times: [], camX: bayX(0), glideFrom: 0 };
const aimPivot = new THREE.Group();
vcam.add(aimPivot);
aimPivot.add(rig.root);
const LAND = { pos: new THREE.Vector3(0.38, -0.27, -0.62), rot: new THREE.Euler(0.05, 0.12, 0.15, 'YXZ'), pivot: new THREE.Vector3(0.33, -0.45, -0.30) };
const PORT = { pos: new THREE.Vector3(0.23, -0.47, -0.64), rot: new THREE.Euler(0.04, 0.34, 0.2, 'YXZ'), pivot: new THREE.Vector3(0.19, -0.6, -0.32), tanH: 0.44 };

let VW = 1, VH = 1, ASPK = 1;
function layout() {
  VW = window.innerWidth; VH = window.innerHeight;
  const asp = VW / VH;
  renderer.setPixelRatio(DPR);
  renderer.setSize(VW, VH, false);
  ASPK = clamp((asp - 0.62) / (1.3 - 0.62), 0, 1);
  const tanV = Math.tan(21 * D2R), tanH = Math.max(tanV * asp, lerp(PORT.tanH, 0.6, ASPK));
  vcam.fov = 2 * Math.atan(tanH / asp) / D2R; vcam.aspect = asp; vcam.updateProjectionMatrix();
  const tanHW = Math.max(Math.tan(30 * D2R) * asp, lerp(0.44, 0.72, ASPK));
  wcam.fov = 2 * Math.atan(tanHW / asp) / D2R; wcam.aspect = asp; wcam.updateProjectionMatrix();
  const piv = new THREE.Vector3().lerpVectors(PORT.pivot, LAND.pivot, ASPK);
  aimPivot.position.copy(piv);
  rig.root.position.copy(new THREE.Vector3().lerpVectors(PORT.pos, LAND.pos, ASPK)).sub(piv);
  rig.root.quaternion.setFromEuler(PORT.rot).slerp(new THREE.Quaternion().setFromEuler(LAND.rot), ASPK);
  const res = new THREE.Vector2(); renderer.getDrawingBufferSize(res);
  rig.outlineMat.uniforms.uRes.value.copy(res);
  rig.outlineMat.uniforms.uWidth.value = 1.25 * DPR * clamp(Math.min(VW, VH) / 720, 0.75, 1.4);
  for (const m of monsters) m.setRes(res, 1.3 * DPR * clamp(Math.min(VW, VH) / 720, 0.75, 1.4));
  pointScale = res.y / (2 * Math.tan(wcam.fov * D2R / 2));
}
let pointScale = 600;

// ================================================================== water fx
const STREAM_VS = `
attribute float aT;
varying float vT; varying vec3 vN; varying vec3 vV;

    if (o.view) { lookYawT = o.view[0]; lookPitchT = o.view[1]; if (o.snap) { lookYaw = pYaw = o.view[0]; lookPitch = pPitch = o.view[1]; } }
    if (o.fire !== undefined) firing = o.fire;
    if (o.tool) setTool(o.tool);
    if (o.look) setLook(o.look);
  },
  land(o) { if (o.pos) LAND.pos.set(...o.pos); if (o.rot) LAND.rot.set(...o.rot, 'YXZ'); if (o.pivot) LAND.pivot.set(...o.pivot); layout(); },
  port(o) { if (o.pos) PORT.pos.set(...o.pos); if (o.rot) PORT.rot.set(...o.rot, 'YXZ'); if (o.pivot) PORT.pivot.set(...o.pivot); if (o.tanH) PORT.tanH = o.tanH; layout(); },
  step(ms) { frame((now + ms / 1000) * 1000); },
  grab(label) {
    const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
    const g = c.getContext('2d'); g.drawImage(cv, 0, 0); g.drawImage(rc, 0, 0, c.width, c.height);
    if (label) {
      const s = c.height / 844 * (c.width > c.height ? 1.5 : 1);
      g.font = `700 ${Math.round(17 * s)}px "Noto Sans KR", sans-serif`;
      const w = g.measureText(label).width + 30 * s, h = 40 * s, x = (c.width - w) / 2, y = c.height - h - 26 * s;
      g.fillStyle = 'rgba(12,16,28,0.66)'; g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill();
      g.fillStyle = '#ffe08a'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, c.width / 2, y + h / 2 + 1 * s);
    }
    return c.toDataURL('image/jpeg', 0.92);
  },
  game(cmd, i) { if (cmd === 'start') startGame(); else if (cmd === 'zone') { hideOverlays(); hud.top.hidden = false; enterZone(i, true); } else if (cmd === 'play') { setState('play'); } },
  state: () => ({ nz: nozzleScreen(new THREE.Vector3()).toArray().slice(0, 2).map((v) => +v.toFixed(3)), corr: [+corrYaw.toFixed(3), +corrPitch.toFixed(3)], hd: +hitDist.toFixed(2), cam: wcam.position.toArray().map((v) => +v.toFixed(2)), rot: [+wcam.rotation.x.toFixed(3), +wcam.rotation.y.toFixed(3)], g: G.state, zone: G.zone, left: +G.left.toFixed(2), hp: monsters[G.zone].hp(), frac: +monsters[G.zone].frac().toFixed(4), hitMon: !!hitMon, firing, attract, yaw: +lookYawT.toFixed(4), pitch: +lookPitchT.toFixed(4), locked, plFailed, btn: fireBtn.dataset.on }),
  stats: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, dpr: DPR }),
};
